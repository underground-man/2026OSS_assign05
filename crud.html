<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cruddddd</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 입력데이터 폼 -->
    <form id="set" method="post">
        <p>제목</p>
        <input id="title" type="text">
        <p>출시년도</p>
        <input id="year" type="number">
        <p>가격</p>
        <input id="price" type="number">
        <p>작가</p>
        <input id="author" type="text">
        <p>분류</p>
        <input id="category" type="text">
        <button id="submit">
            추가
        </button>

    </form>


    <!-- 출력 -->
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>이름</th>
                <th>출시 날짜</th>
                <th>가격</th>
                <th>작가</th>
                <th>분류</th>
            </tr>
        </thead>

        <tbody id="sets">

        </tbody>
    </table>



    <script>
        let books = [{ id: 1, title: "java", publishedYear: 2011, price: 10000, author: "cruise", category: "science" }, { id: 2, title: "python", publishedYear: 1999, price: 15000, author: "chandler", category: "science" }, { id: 3, title: "C", publishedYear: 2000, price: 13000, author: "curnel", category: "science" }];
        let id = 3;
        let blocks = [];
        let sbut = document.querySelector("#submit");

        const ta = document.querySelector("#sets");

        let stcheck =null;


                    let title = document.querySelector("#title");
            let pub = document.querySelector("#year");
            let price = document.querySelector("#price");
            let author = document.querySelector("#author");
            let category = document.querySelector("#category");

        function add() {
         event.preventDefault();  
         
         //validationdfnspodfjnspdfasnksabdkdsjvs뭐시기 

        if(title.value.trim()==""){
            alert("이름이 없습니다.");
            title.focus();
            return;
        }

        
        if(Number(price.value)<3000){
            alert("가격이 너무 싸요.");
            price.focus();
            return;
        }

        
        if(author.value.trim()==""){
            alert("작가 이름이 없습니다.");
            author.focus();
            return;
        }

        

         

            if(stcheck){

            
            let target = books.findIndex (function(book){
                return book.id==stcheck.id;
            });

            books[target] = { id: stcheck.id, title: title.value, publishedYear: Number(pub.value), price: Number(price.value), author: author.value, category: category.value };

        }

            else{
            
            books.push({ id: ++id, title: title.value, publishedYear: Number(pub.value), price: Number(price.value), author: author.value, category: category.value });
            }


            cre();

            stcheck=null;
            sbut.innerText="추가";

            form.reset();
        
    }

        function cre() {

            ta.textContent = "";

            books.forEach(function (book) {

                let col = document.createElement("tr");
                let a = document.createElement("td");
                let b = document.createElement("td");
                let c = document.createElement("td");
                let d = document.createElement("td");
                let e = document.createElement("td");
                let f = document.createElement("td");
                let g = document.createElement("td");


                let button1 = document.createElement("button");
                let button2 = document.createElement("button");
                button1.classList.add("abutton");
                button2.classList.add("dbutton");




                a.textContent = book.id;
                b.textContent = book.title;
                c.textContent = book.publishedYear;
                d.textContent = book.price;
                e.textContent = book.author;
                f.textContent = book.category;

                button1.innerText = "수정";
                button2.innerText = "삭제";


                ta.appendChild(col);


                col.appendChild(a);
                col.appendChild(b);
                col.appendChild(c);
                col.appendChild(d);
                col.appendChild(e);
                col.appendChild(f);
                col.appendChild(g);
                g.appendChild(button1);
                g.appendChild(button2);


                button1.addEventListener("click",function(){
                                   title.value=book.title  ;
                  pub.value =book.publishedYear ;
                  price.value=book.price ;
                  author.value=book.author ;
                  category.value=book.category ;
                  stcheck = book;
                  sbut.innerText="수정";
                
                });




                
                button2.addEventListener("click", function () {
                    if (confirm("삭제를 원하는가?")) {
                        books = books.filter(function (com) {
                            return book.id !== com.id;
                        });
                        cre();
                    }

                });



            }
            );

        }


        window.onload = function () {
            cre();
        }


        const form = document.querySelector("#set");
        form.addEventListener("submit", add);



    </script>
</body>

</html>
